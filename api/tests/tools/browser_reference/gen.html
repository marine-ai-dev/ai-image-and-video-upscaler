<!doctype html>
<!-- Regenerates tests/reference/harness/*.png with the REAL @websr/websr (node_modules dist)
     in Chrome/WebGPU, through the SAME pipeline code the website's worker uses:
     src/lib/render-chain.ts (PassFrame edge padding + crop, renderChain, matte, composeAlpha,
     encodeCanvas) and src/lib/upscale-math.ts (padded sizes). server.py transpiles those
     TypeScript files on the fly (/lib/*), so nothing here re-implements them; only the
     per-pass WebSR instance setup below mirrors worker.ts getInstance()/buildChain().
     Usage:  python3 tests/tools/browser_reference/server.py
     then open http://127.0.0.1:8097/gen.html in Chrome; outputs appear in _out/.
     Format "raw" = non-PNG output type: the canvas is snapshotted losslessly instead of
     encoding lossy JPEG/WebP. -->
<html><body><pre id="out">starting</pre>
<script src="/websr.js"></script>
<script type="module">
import { PassFrame, renderChain, encodeCanvas } from '/lib/render-chain.js';

const log=[]; const out=document.getElementById('out');
function say(s){log.push(s); out.textContent=log.join('\n');}
let device;

async function runJob(job){
  const weights=await (await fetch(`/weights/cnn-2x-${job.size[0]}-${job.content}.json`)).json();
  const blob=await (await fetch(`/input/${job.input}`)).blob();
  const bitmap=await createImageBitmap(blob);
  const preserve=job.format==='png';

  // One WebSR instance per pass, built at the PADDED size (worker.ts getInstance/buildChain).
  const steps=[]; let w=bitmap.width, h=bitmap.height;
  for(let i=0;i<job.passes;i++){
    const frame=new PassFrame({width:w,height:h});
    const g=frame.geometry;
    const canvas=new OffscreenCanvas(g.paddedOutput.width,g.paddedOutput.height);
    const websr=new WebSR({network_name:`anime4k/cnn-2x-${job.size[0]}`,weights,resolution:g.padded,gpu:device,canvas});
    steps.push({frame,canvas,render:(src)=>websr.render(src)});
    w*=2; h*=2;
  }

  const finalCanvas=await renderChain(steps,bitmap,{preserveAlpha:preserve});
  const outBlob=preserve
    ? await encodeCanvas(finalCanvas,'image/png',bitmap)
    : await finalCanvas.convertToBlob({type:'image/png'});
  const r=await fetch(`/save?name=${job.name}.png`,{method:'POST',body:outBlob});
  say(job.name+' '+r.status+' '+outBlob.size+' '+finalCanvas.width+'x'+finalCanvas.height);
}
(async()=>{
  try{
    const adapter=await navigator.gpu.requestAdapter(); device=await adapter.requestDevice();
    const jobs=await (await fetch('/jobs.json')).json();
    for(const j of jobs){ try{ await runJob(j);}catch(e){say(j.name+' ERR '+e);} }
    say('DONE');
  }catch(e){say('FATAL '+e+' '+(e.stack||''));}
})();
</script></body></html>
